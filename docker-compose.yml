services:
  postgres:
    image: postgres:15-alpine
    container_name: opsflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: opsflow
    ports:
      - "5432:5432"
    volumes:
      - opsflow_pgdata:/var/lib/postgresql/data

volumes:
  opsflow_pgdata:
